lm.keycloak.client-secret=nU1SYrqp75SrCKuo7wnNgzokBd7YNVUN

# ── Affinity Config Storage ───────────────────────────────────────────────────
# Path where affinity region config is persisted across restarts.
# Default: <user.home>/lm-routing-data/affinity-config.json
# Override for Docker/EC2: affinity.config.storage.path=/root/lm-routing-data/affinity-config.json
# affinity.config.storage.path=

# ── Time-Based Allocation (Affinity Shift Mode) ───────────────────────────────
# Maximum working time per SR per day in minutes (default: 480 = 8 hours).
# Used in time-based mode to cap each SR's estimated shift workload.
allocation.shift.duration.minutes=600

# Per-shipment handling time in minutes used by the workload calculator.
# Uniform 5 min for all shipment types (COD and Prepaid)
allocation.handling.time.cod=5.0
allocation.handling.time.prepaid=5.0

# Target utilisation for dense packing (88% = safe buffer for real-world travel variance)
allocation.shift.target.utilisation=0.88

# Break buffer in minutes (inserted at midpoint of route in timeline)
# This is included in the workload calculation to ensure packer and timeline agree.
allocation.shift.break.minutes=30
allocation.handling.time.default=5.0

# Fallback average travel speed in km/h used ONLY when neither ORS nor Google Maps
# is configured. Real road travel times from ORS or Google Maps are preferred.
allocation.shift.avg.speed.kmh=20

# Road factor multiplier applied to Haversine distances for ETA consistency.
# This replaces the previously hardcoded 1.15 in TravelTimeCacheService.
# Set to 1.0 — the distance-aware speed model (12/15/20/25 km/h) already accounts
# for urban delivery patterns. No additional inflation needed.
# CRITICAL: This single value is used by BOTH packing (ShiftWorkloadCalculatorService)
# AND SR timeline (SrTimelineService) to ensure ETA consistency.
allocation.route.optimizer.road.factor=1.0

# ── Route Optimization Strategy ───────────────────────────────────────────────
# Options: "cluster-first" (default), "or-tools", "legacy" (nearest-neighbour + 2-opt)
allocation.route.optimizer.strategy=cluster-first
# Max shipments per cluster for CFRS (smaller = better TSP quality, more clusters)
allocation.route.optimizer.cluster.size=12

# ── Earnings Balancing ────────────────────────────────────────────────────────
# Target: at least this fraction of SRs within ±20% of median earnings
allocation.earnings.balance.target=0.50
# Max iterations for earnings balancing pass
allocation.earnings.balance.maxIterations=50

# ── Small Leftover Threshold ──────────────────────────────────────────────────
# Shipments below this count won't activate a new SR (marked unallocated instead)
# After dense packing, if overflow < this threshold and consolidation fails,
# those shipments are marked unallocated rather than activating an additional SR.
allocation.leftover.min.threshold=10

# ── OR-Tools VRP (optional) ───────────────────────────────────────────────────
# Set to true to enable OR-Tools VRP solver (requires native library on classpath)
allocation.ortools.enabled=false

# Maximum number of 2-opt improvement iterations per SR route.
# The optimiser stops early if no improving swap is found before this limit.
allocation.twoopt.max.iterations=100

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8082
