# ── Hub configuration ─────────────────────────────────────────────────────────
hub.name=PNQ HDP
hub.latitude=18.4600561
hub.longitude=73.8884305
hub.sr.names=SR-001,SR-002,SR-003,SR-004,SR-005,SR-006,SR-007,SR-008,SR-009,SR-010,SR-011,SR-012,SR-013,SR-014,SR-015
# Max distance from hub — shipments beyond this are flagged (not excluded)
hub.max.distance.km=50.0

# ── Composite Load Score weights ──────────────────────────────────────────────
# w1=shipment count, w2=total phy weight, w3=estimated distance km, w4=heavy count
# w3 is secondary — primary fairness is driven by net earnings (payout - 2.5×km)
allocation.weights.w1=1.0
allocation.weights.w2=0.0
allocation.weights.w3=1.0
allocation.weights.w4=0.0

# ── Fairness rebalancing ──────────────────────────────────────────────────────
# Rebalancing runs until no single boundary transfer further reduces the earnings
# range (local optimum) or maxIterations is reached. There is no hard earnings-range
# cap — the objective is to minimise variance as much as possible.
# threshold (₹5): skip rebalancing entirely when the earnings range is already
# negligibly small (< ₹5). Raised from ₹1 to avoid unnecessary micro-iterations.
allocation.rebalancing.threshold=5.0
allocation.rebalancing.maxIterations=200

# ── File upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ── SR Capacity ───────────────────────────────────────────────────────────────
# Capacity range per SR per day.
# srCapacityMin: minimum target shipments per SR (informational lower bound)
# srCapacityMax: maximum shipments per SR — used to compute total capacity cap
#   totalCapacity = presentSRs * srCapacityMax (excess shipments are unallocated)
# Change these values here before demo to adjust the limits.
allocation.sr.capacity.min=80
allocation.sr.capacity.max=80

# ── Allocation boundary ───────────────────────────────────────────────────────
# FALLBACK ONLY: used when the hub boundary polygon cannot be fetched from the
# external API (/api/hub/boundary). The primary boundary check uses the actual
# polygon coordinates from the Xpressbees orchestration API.
# Any shipment outside the hub boundary polygon is excluded from routing.
allocation.boundary.km=25.0

# ── LM API Integration (Stage Environment) ───────────────────────────────────
lm.api.base-url=https://lastmileallocationpod-apistage.xbees.in
lm.api.xbkey=$LAST$Mile%#$
lm.api.hub-id=614
lm.api.delay-ms=200

# ── Keycloak (Stage) ─────────────────────────────────────────────────────────
