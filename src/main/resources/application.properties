spring.application.name=LMrouting

# ── Database: disabled (using in-memory store) ────────────────────────────────
# JPA is still on classpath for model compatibility but we don't use a real DB.
# Using H2 in-memory just to satisfy Spring Boot auto-config; no data is stored there.
spring.datasource.url=jdbc:h2:mem:lmrouting_noop
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# ── Google Maps API Key ───────────────────────────────────────────────────────
# Replace with your key for real road routing via Google Maps Directions API
google.maps.api.key=AIzaSyDNafaADC6wU0gdPfqH0fMAk1gh7I3l6Us

# ── OpenRouteService API Key ──────────────────────────────────────────────────
# Free tier: 2000 req/day — sign up at https://openrouteservice.org/dev/#/signup
